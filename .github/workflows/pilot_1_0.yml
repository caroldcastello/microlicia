name: Microlicia pilot 1.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pilot_1_0.yml'
      - 'config/analysis.yml'
      - 'data/input/**'
      - 'data/metadata/**'
      - 'requirements.txt'
      - 'scripts/pilot_1_0.py'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install analysis packages
        run: python -m pip install -r requirements.txt
      - name: Generate the dated MCC figure with all taxa
        run: python scripts/pilot_1_0.py --tree-figure-only
      - name: Run Microlicia Pilot 1.1
        run: python scripts/pilot_1_0.py
      - name: Upload report, metadata, tables, and figures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microlicia-pilot-1.1-results
          path: results/
          if-no-files-found: error
          retention-days: 90
