name: Microlicia pilot 1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install analysis packages
        run: python -m pip install -r requirements.txt
      - name: Run Pilot 1.0
        run: python scripts/pilot_1_0.py
      - name: Upload report, metadata, tables, and figures
        uses: actions/upload-artifact@v4
        with:
          name: microlicia-pilot-1.0-results
          path: results/
          if-no-files-found: error
          retention-days: 90
