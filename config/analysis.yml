# Paths relative to repository root. The main Python script uses these same paths.
files:
  mcc_tree: data/input/teste_datacao_MCC.tree
  occurrences: data/input/ocorrencias.xlsx.csv
  stamen_traits: data/input/estames.csv
  dating_reference: data/metadata/fonte_datação.json
  occurrence_filter_audit: data/metadata/taxa_ocorrencias_excluidos_sem_correspondencia.csv

occurrence_format:
  delimiter: ";"
  encoding: "UTF-8"
  original_taxon_column: "Taxon_original"
  tree_taxon_column: "taxon_tree"
  longitude_column: "Longitude_decimal"
  latitude_column: "Latitude_decimal"
  name_rule: "Use taxon_tree when supplied; otherwise use Taxon_original and remove whitespace only between m_ and the epithet"
  corrected_tree_tip_labels:
    m_bellineloi: m_belinelloi
    m_diamantinensis: m_diamantinesis

analysis_scope:
  focal_genus: Microlicia
  occurrence_analyses: Microlicia tree tips only
  stamen_analyses: Microlicia tree tips only
  dated_tree_figure: all 153 tree tips
  non_microlicia_tips_in_analysis: false

figures:
  dated_tree_all_taxa:
    outputs: [dated_tree_all_taxa.png, dated_tree_all_taxa.pdf]
    labels: full genus and species names
    highlight: Microlicia
    time_axis_label: age in numeric MCC units pending scale reconciliation

stamen_traits:
  delimiter: ";"
  encoding: "UTF-8"
  taxon_column: ""
  categorical_columns:
    - "(0) dimorphic (1) subisomorphic (2) isomorphic"
    - "(0) concolours (1) bicolours"
    - "(0) tetrasporangiate (1) polysporangiate"

dating:
  intended_scale: "Ma (inference from the source calibration table)"
  xml_label_observed: "years"
  source: "Reginato et al. 2022, Table 3, p. 94"
  status: "Reconcile against the exact BEAST run configuration before final interpretation"
